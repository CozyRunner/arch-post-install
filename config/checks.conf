# ──────────────────────────────────────────────────────────────────────────────
# checks.conf
# Post-Installation Validation & System-Health Framework Configuration
# ──────────────────────────────────────────────────────────────────────────────

# Default desktop profile to validate against (matches profile YAML in config/)
DEFAULT_PROFILE="hyprland"

# Filesystem capacity thresholds (percentage used)
DISK_WARN_PERCENT=80
DISK_FAIL_PERCENT=95

# Inode usage thresholds (percentage used)
INODE_WARN_PERCENT=85
INODE_FAIL_PERCENT=95

# Systemd journal disk usage thresholds (in Megabytes)
JOURNAL_WARN_MB=500
JOURNAL_FAIL_MB=2048

# Network connectivity check targets
PING_HOST="archlinux.org"
PING_TIMEOUT=3
HTTP_URL="https://archlinux.org"
HTTP_TIMEOUT=5

# Memory & Swap usage thresholds (percentage used)
MEM_WARN_PERCENT=85
MEM_FAIL_PERCENT=95
SWAP_WARN_PERCENT=80
SWAP_FAIL_PERCENT=95

# Timeouts in seconds for subshell commands
CMD_TIMEOUT=5
