#
# Glassmorphism "Lumina" Lock Screen
# Per-theme colors are in hyprlock-colors.conf (sourced below)

source = $HOME/.config/hypr/hyprlock-colors.conf

general {
    no_fade_in        = false
    no_fade_out       = false
    grace             = 0
    disable_loading_bar = true
    hide_cursor       = false
}

# ── Background ── blurred screenshot for frosted glass depth
background {
    monitor    =
    path       = screenshot
    blur_passes = 4
    blur_size   = 10
    noise       = 0.010
    contrast    = 0.85
    brightness  = 0.65
    vibrancy    = 0.18
    vibrancy_darkness = 0.0
}

# ── Glass card shape: a centered frosted panel
# (achieved by a large shape widget behind the form elements)
shape {
    monitor =
    size          = 420, 340
    color         = $glass_card_bg
    rounding      = 24
    border_size   = 1
    border_color  = $glass_card_border
    shadow_passes = 3
    shadow_size   = 20
    shadow_color  = $glass_shadow
    position      = 0, 0
    halign        = center
    valign        = center
}

# ── Time ──
label {
    monitor     =
    text        = <b>$TIME</b>
    color       = $time_color
    font_size   = 72
    font_family = JetBrainsMono Nerd Font
    position    = 0, 100
    halign      = center
    valign      = center
    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = rgba(0, 0, 0, 0.40)
}

# ── Date ──
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date '+%A, %B %-d')"
    color       = $date_color
    font_size   = 16
    font_family = JetBrainsMono Nerd Font
    position    = 0, 38
    halign      = center
    valign      = center
}

# ── Greeting ──
label {
    monitor     =
    text        =  $USER
    color       = $greeting_color
    font_size   = 14
    font_family = JetBrainsMono Nerd Font
    position    = 0, -30
    halign      = center
    valign      = center
}

# ── Password input field ──
input-field {
    monitor             =
    size                = 280, 50
    outline_thickness   = 2
    dots_size           = 0.28
    dots_spacing        = 0.20
    dots_center         = true
    dots_rounding       = -1
    outer_color         = $input_outer_color
    inner_color         = $input_inner_color
    font_color          = $input_font_color
    fade_on_empty       = true
    fade_timeout        = 1200
    placeholder_text    = <i>Enter password…</i>
    hide_input          = false
    rounding            = 12
    check_color         = $input_check_color
    fail_color          = $input_fail_color
    fail_text           = <i>$FAIL  <b>($ATTEMPTS)</b></i>
    fail_transition     = 300
    capslock_color      = $input_caps_color
    numlock_color       = -1
    bothlock_color      = -1
    invert_numlock      = false
    swap_font_color     = false
    position            = 0, -100
    halign              = center
    valign              = center
}
