# Hyprland Theme — Catppuccin Latte (Light)
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7287fdff) rgba(04a5e5ff) 45deg
    col.inactive_border = rgba(bac2deaa)
    resize_on_border = true
}
decoration {
    rounding = 10
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(ccd0daaa)
    }
    blur {
        enabled = true
        size = 6
        passes = 3
        ignore_opacity = true
        new_optimizations = true
    }
}
blurls = rofi
blurls = wlogout
