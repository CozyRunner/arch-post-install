###################                                                                                                   
### KEYBINDINGS ###                                                                                                   
###################                                                                                                   
                                                                                                                      
# See https://wiki.hypr.land/Configuring/Keywords/                                                                    
$mainMod = SUPER # Sets "Windows" key as main modifier                                                                

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more     

## Hot Keys## Programs                                
bind = $mainMod, N, exec, ~/.config/hypr/scripts/toggle_theme.sh
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/theme_picker.sh
bind = $mainMod, M, exec, ~/.config/hypr/scripts/floating_menu.sh
bind = $mainMod SHIFT, C, exec, $terminal -e calcure
bind = $mainMod SHIFT, J, exec, $terminal -e tjournal

## Brightness Control
bindel = $mainMod, F1, exec, brightnessctl set 5%-
bindel = $mainMod, F2, exec, brightnessctl set 5%+
