# Hyprland Theme — Catppuccin Mocha (Dark)
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(a6e3a1ff) rgba(94e2d5ff) 45deg
    col.inactive_border = rgba(313244aa)
    resize_on_border = true
}
decoration {
    rounding = 10
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(11111baa)
    }
    blur {
        enabled = true
        size = 6
        passes = 3
        ignore_opacity = true
        new_optimizations = true
    }
}
blurls = rofi
blurls = wlogout
